name: Daily LeetCode Solver

on:
  schedule:
    # Triggers daily at 10:05 UTC (15:50 Nepal Time), then waits a random delay before each solve
    - cron: '5 10 * * *'
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Skip random sleep delays (for quick manual test)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  solve-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout Runner Repo
        uses: actions/checkout@v5

      - name: Load or Create .env from Secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
          TARGET_BRANCH: ${{ secrets.TARGET_BRANCH }}
        run: |
          if [ ! -f .env ]; then
            if [ -n "$ENV_FILE" ]; then
              printf "%s\n" "$ENV_FILE" | tr -d '\r' > .env
            else
              {
                echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
                echo "PAT_TOKEN=${PAT_TOKEN}"
                echo "TARGET_REPO=${TARGET_REPO}"
                echo "GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}"
                echo "GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}"
                echo "TARGET_BRANCH=${TARGET_BRANCH:-main}"
              } > .env
            fi
          fi
          tr -d '\r' < .env | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Solve 2-3 Random LeetCode Problems with Random Delays & Push
        env:
          SKIP_DELAY: ${{ inputs.skip_delay || 'false' }}
        run: python3 solve_leetcode.py

      - name: Save Solved State in Runner Repo
        if: always()
        run: |
          rm -f .env
          git config user.name "${GIT_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${GIT_AUTHOR_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git add solved_problems.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update solved problems list"
            git pull origin "${{ github.ref_name }}" --rebase --autostash || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi
