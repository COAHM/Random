name: Daily LeetCode Solver

on:
  workflow_dispatch:
    inputs:
      skip_delay:
        description: 'Commit with current time instead of backdated times (manual test)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

jobs:
  solve-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Runner Repo
        uses: actions/checkout@v5

      - name: Load or Create .env from Secrets
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          TARGET_REPO: ${{ secrets.TARGET_REPO }}
          GIT_AUTHOR_NAME: ${{ secrets.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ secrets.GIT_AUTHOR_EMAIL }}
          TARGET_BRANCH: ${{ secrets.TARGET_BRANCH }}
        run: |
          if [ ! -f .env ]; then
            if [ -n "$ENV_FILE" ]; then
              printf "%s\n" "$ENV_FILE" | tr -d '\r' > .env
            else
              {
                echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
                echo "PAT_TOKEN=${PAT_TOKEN}"
                echo "TARGET_REPO=${TARGET_REPO}"
                echo "GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME}"
                echo "GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL}"
                echo "TARGET_BRANCH=${TARGET_BRANCH:-main}"
              } > .env
            fi
          fi
          # Mask each value individually; values inside the multi-line ENV_FILE secret
          # are not reliably masked on their own (logs are public on a public repo).
          while IFS='=' read -r key value; do
            value="${value%\"}"; value="${value#\"}"
            if [ -n "$value" ] && [ "$key" != "TARGET_BRANCH" ]; then
              echo "::add-mask::$value"
              # GEMINI_API_KEY may hold several comma-separated keys; mask each one too
              IFS=',' read -ra parts <<< "$value"
              for part in "${parts[@]}"; do
                part="${part#"${part%%[![:space:]]*}"}"; part="${part%"${part##*[![:space:]]}"}"
                if [ -n "$part" ]; then echo "::add-mask::$part"; fi
              done
            fi
          done < <(tr -d '\r' < .env | grep -v '^#' | grep -v '^[[:space:]]*$')
          tr -d '\r' < .env | grep -v '^#' | grep -v '^[[:space:]]*$' >> "$GITHUB_ENV"

      - name: Solve 2-5 Random LeetCode Problems (Backdated Commits) & Push
        env:
          SKIP_DELAY: ${{ inputs.skip_delay || 'false' }}
          COMMIT_TZ: Asia/Kathmandu
        run: python3 solve_leetcode.py

      - name: Save Solved State in Runner Repo
        if: always()
        run: |
          rm -f .env
          git config user.name "${GIT_AUTHOR_NAME:-github-actions[bot]}"
          git config user.email "${GIT_AUTHOR_EMAIL:-github-actions[bot]@users.noreply.github.com}"
          git add solved_problems.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update solved problems list"
            git pull origin "${{ github.ref_name }}" --rebase --autostash || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi
